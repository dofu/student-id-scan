<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #5c6670; --line: #dde1e6;
    --brand: #1f6feb; --brand-text: #ffffff;
    --ok-bg: #e7f6ec; --ok-text: #135c2c; --ok-line: #9fd8b1;
    --warn-bg: #fff4dc; --warn-text: #6b4800; --warn-line: #f0cf86;
    --err-bg: #fde8e8; --err-text: #8a1c1c; --err-line: #f1a9a9;
    --photo: #e3e9f1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1b2026; --text: #e8ecf0; --muted: #9aa5b1; --line: #2e353d;
      --brand: #4c8dff; --brand-text: #0b0f14;
      --ok-bg: #12301d; --ok-text: #9fe0b4; --ok-line: #24583a;
      --warn-bg: #33270b; --warn-text: #f3d48c; --warn-line: #5e4a1a;
      --err-bg: #3a1616; --err-text: #f4b0b0; --err-line: #6a2a2a;
      --photo: #232a33;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body {
    font: 17px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    max-width: 520px; margin: 0 auto;
  }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .card {
    display: flex; flex-direction: column; gap: 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; margin-bottom: 16px;
  }
  .btn {
    display: flex; align-items: center; justify-content: center;
    width: 100%; min-height: 56px; padding: 16px; border-radius: 12px;
    font: inherit; font-weight: 600; border: 1px solid var(--brand); cursor: pointer;
    background: var(--brand); color: var(--brand-text); text-align: center;
  }
  .btn.secondary { background: transparent; color: var(--brand); }
  .btn:disabled { opacity: .5; cursor: default; }
  input[type=file] { display: none; }
  .hint { font-size: 15px; color: var(--muted); margin: 0; }
  .field label { display: block; font-size: 15px; color: var(--muted); margin-bottom: 6px; }
  .field input {
    width: 100%; padding: 12px; font: inherit; font-size: 20px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--text);
  }
  .field input::placeholder { color: var(--muted); }
  #idInput { letter-spacing: .04em; font-variant-numeric: tabular-nums; }
  #preview { display: block; width: 100%; border-radius: 12px; background: var(--photo); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips:empty { display: none; }
  .chip {
    padding: 8px 14px; border-radius: 20px; font: inherit; font-size: 16px;
    border: 1px solid var(--line); background: var(--bg); color: var(--text); cursor: pointer;
  }
  .chip[aria-pressed=true] { border-color: var(--brand); color: var(--brand); font-weight: 600; }
  .notice { border-radius: 14px; padding: 16px; margin-bottom: 16px; border: 1px solid; }
  .notice h2 { margin: 0 0 4px; font-size: 20px; }
  .notice p { margin: 0; }
  .notice.ok { background: var(--ok-bg); color: var(--ok-text); border-color: var(--ok-line); }
  .notice.warn { background: var(--warn-bg); color: var(--warn-text); border-color: var(--warn-line); }
  .notice.err { background: var(--err-bg); color: var(--err-text); border-color: var(--err-line); }
  .record { margin: 0; }
  .record div + div { margin-top: 12px; }
  .record dt { font-size: 14px; color: var(--muted); }
  .record dd { margin: 2px 0 0; font-weight: 500; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>Student ID scan</h1>

  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>

  <!-- Screen 1 (ready) and screen 2 (photo taken) -->
  <div class="card" id="photoCard">
    <img id="preview" alt="Photo of the scanned card" hidden>
    <p class="hint" id="ocrStatus">Hold the card flat, fill the frame, avoid glare.</p>
    <label class="btn" id="scanBtn" for="camera">Scan card</label>
    <button class="btn secondary" id="typeBtn" type="button">Type details instead</button>
  </div>
  <input id="camera" type="file" accept="image/*" capture="environment">

  <!-- Screens 2 and 5: details form -->
  <div class="card" id="form" hidden>
    <div class="field">
      <label for="idInput">Student ID</label>
      <input id="idInput" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Type the ID as printed">
    </div>
    <div class="chips" id="chips"></div>
    <div class="field">
      <label for="nameInput">Name</label>
      <input id="nameInput" autocomplete="off" autocapitalize="words" placeholder="As printed on the card">
    </div>
    <div class="field">
      <label for="uniInput">University</label>
      <input id="uniInput" list="uniList" autocomplete="off" autocapitalize="words" placeholder="Choose or type">
      <datalist id="uniList"></datalist>
    </div>
    <button class="btn" id="saveBtn" type="button" disabled>Check and save</button>
    <label class="btn secondary" id="retakeBtn" for="camera" hidden>Retake photo</label>
  </div>

  <!-- Screens 3 and 4: result -->
  <div class="card" id="result" hidden>
    <dl class="record" id="record"></dl>
    <button class="btn" id="nextBtn" type="button">Scan next card</button>
  </div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
  // IDs on your cards: adjust if they follow a different format.
  // Default: up to 2 letters, 5 to 10 digits, optional trailing letter (e.g. 2301234, A0123456X).
  const ID_PATTERN = /\b[A-Z]{0,2}\d{5,10}[A-Z]?\b/g;
  const TIP = 'Hold the card flat, fill the frame, avoid glare.';

  const $ = (id) => document.getElementById(id);
  const camera = $('camera'), preview = $('preview'), ocrStatus = $('ocrStatus');
  const photoCard = $('photoCard'), form = $('form'), result = $('result'), record = $('record');
  const idInput = $('idInput'), nameInput = $('nameInput'), uniInput = $('uniInput'), chips = $('chips');
  const saveBtn = $('saveBtn'), nextBtn = $('nextBtn'), notice = $('notice');
  const scanBtn = $('scanBtn'), typeBtn = $('typeBtn'), retakeBtn = $('retakeBtn');
  const hasBackend = typeof google !== 'undefined' && google.script;
  let universities = [];

  if (hasBackend) {
    google.script.run.withSuccessHandler((list) => {
      universities = list || [];
      $('uniList').innerHTML = '';
      universities.forEach((u) => { const o = document.createElement('option'); o.value = u; $('uniList').appendChild(o); });
    }).getUniversities();
  }

  let workerPromise = null;
  function getWorker() {
    if (!workerPromise) {
      workerPromise = Tesseract.createWorker('eng').then(async (w) => {
        await w.setParameters({ tessedit_pageseg_mode: '11' }); // sparse text suits ID cards
        return w;
      });
    }
    return workerPromise;
  }
  getWorker().catch(() => {}); // warm up while the user lines up the card

  function showNotice(kind, title, body) {
    notice.className = 'notice ' + kind;
    notice.innerHTML = '';
    const h = document.createElement('h2'); h.textContent = title;
    const p = document.createElement('p'); p.textContent = body;
    notice.append(h, p);
    notice.hidden = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function clearForm() {
    idInput.value = ''; nameInput.value = ''; uniInput.value = ''; chips.innerHTML = '';
    updateSave();
  }

  // Screen states from the design: ready, photo, failed, manual, result.
  function show(state) {
    notice.hidden = !['failed', 'result'].includes(state);
    photoCard.hidden = !['ready', 'photo'].includes(state);
    form.hidden = !['photo', 'failed', 'manual'].includes(state);
    result.hidden = state !== 'result';
    preview.hidden = state !== 'photo';
    typeBtn.hidden = state !== 'ready';
    scanBtn.textContent = state === 'photo' ? 'Retake photo' : 'Scan card';
    scanBtn.classList.toggle('secondary', state === 'photo');
    retakeBtn.hidden = !['failed', 'manual'].includes(state);
    retakeBtn.textContent = state === 'failed' ? 'Retake photo' : 'Scan card';
    if (state === 'ready') ocrStatus.textContent = TIP;
  }

  function updateSave() { saveBtn.disabled = idInput.value.replace(/[^\dA-Za-z]/g, '').length < 4; }
  idInput.addEventListener('input', () => { markChip(null); updateSave(); });

  // Downscale and greyscale the photo; large phone photos are slow to read.
  function prepareImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const max = 1800, scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
        const c = document.createElement('canvas');
        c.width = Math.round(img.naturalWidth * scale);
        c.height = Math.round(img.naturalHeight * scale);
        const ctx = c.getContext('2d');
        ctx.filter = 'grayscale(1) contrast(1.3)';
        ctx.drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(img.src);
        resolve(c);
      };
      img.onerror = () => reject(new Error('Could not open that photo.'));
      img.src = URL.createObjectURL(file);
    });
  }

  // Fix common letter/digit mix-ups inside number-heavy tokens.
  function cleanToken(t) {
    const digits = (t.match(/\d/g) || []).length;
    if (t.length < 5 || digits / t.length < 0.6) return t;
    const m = t.match(/^([A-Z]{0,2})(.*?)([A-Z]?)$/);
    return m[1] + m[2].replace(/O/g, '0').replace(/[IL]/g, '1') + m[3];
  }

  function findIds(text) {
    const tokens = text.toUpperCase().replace(/[^\dA-Z\s]/g, ' ').split(/\s+/).filter(Boolean).map(cleanToken);
    const found = [...new Set(tokens.join(' ').match(ID_PATTERN) || [])];
    return found.sort((a, b) => b.length - a.length);
  }

  // Picks a known university whose name appears on the card.
  function findUniversity(text) {
    const flat = text.toUpperCase().replace(/[^\dA-Z]+/g, ' ');
    return universities.find((u) => flat.includes(u.toUpperCase().replace(/[^\dA-Z]+/g, ' ').trim())) || '';
  }

  function markChip(value) {
    chips.querySelectorAll('.chip').forEach((c) => c.setAttribute('aria-pressed', String(c.textContent === value)));
  }
  function renderChips(ids) {
    chips.innerHTML = '';
    if (ids.length < 2) return;
    ids.slice(0, 6).forEach((id) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = id;
      b.onclick = () => { idInput.value = id; markChip(id); updateSave(); };
      chips.appendChild(b);
    });
    markChip(ids[0]);
  }

  function failed() {
    show('failed');
    showNotice('err', 'Could not read the card', 'Type the details from the card, or retake the photo closer and without glare.');
    idInput.focus();
  }

  camera.addEventListener('change', async () => {
    const file = camera.files && camera.files[0];
    if (!file) return;
    clearForm();
    preview.src = URL.createObjectURL(file);
    show('photo');
    ocrStatus.textContent = 'Reading card...';
    try {
      const [canvas, worker] = await Promise.all([prepareImage(file), getWorker()]);
      const { data } = await worker.recognize(canvas);
      const text = data.text || '';
      const ids = findIds(text);
      if (!ids.length) { failed(); }
      else {
        idInput.value = ids[0];
        renderChips(ids);
        uniInput.value = findUniversity(text);
        ocrStatus.textContent = 'Check the details match the card, then save.';
      }
    } catch (e) {
      failed();
    }
    updateSave();
    camera.value = '';
  });

  typeBtn.addEventListener('click', () => { clearForm(); show('manual'); idInput.focus(); });

  function row(label, value) {
    if (!value) return;
    const d = document.createElement('div');
    const t = document.createElement('dt'); t.textContent = label;
    const v = document.createElement('dd'); v.textContent = value;
    d.append(t, v); record.appendChild(d);
  }

  saveBtn.addEventListener('click', () => {
    if (!hasBackend) {
      showNotice('err', 'Not connected', 'Open this page from its Apps Script web app link.');
      return;
    }
    saveBtn.disabled = true; saveBtn.textContent = 'Checking...';
    google.script.run
      .withSuccessHandler((r) => {
        saveBtn.textContent = 'Check and save';
        const offer = r.offer ? '  Eligible: ' + r.offer : '';
        record.innerHTML = '';
        if (r.status === 'new') {
          const who = r.name ? r.name + ' (' + r.id + ')' : r.id;
          showNotice('ok', 'Added', who + ' is new and has been saved.' + offer);
          if (r.university && !universities.includes(r.university)) universities.push(r.university);
        } else {
          showNotice('warn', 'Already in the system', 'Scanned ' + r.scans + ' times in total.' + offer);
          row('University', r.university);
          row('Last scanned before this', r.lastScanned);
        }
        record.hidden = !record.children.length;
        show('result');
      })
      .withFailureHandler((err) => {
        saveBtn.textContent = 'Check and save';
        updateSave();
        showNotice('err', 'Not saved', (err && err.message) || 'Something went wrong. Try again.');
      })
      .checkIn(idInput.value, nameInput.value, uniInput.value);
  });

  nextBtn.addEventListener('click', () => {
    clearForm();
    preview.removeAttribute('src');
    show('ready');
    camera.click();
  });

  show('ready');
</script>
</body>
</html>
